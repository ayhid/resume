<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #0a0014;
      position: relative;
      overflow: hidden;
    }

    /* Aurora background effect */
    .aurora {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(120, 0, 255, 0.5) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 0%, rgba(255, 0, 150, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(0, 200, 255, 0.3) 0%, transparent 50%),
        radial-gradient(ellipse 50% 30% at 10% 60%, rgba(100, 0, 255, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse 40% 40% at 90% 70%, rgba(255, 100, 200, 0.3) 0%, transparent 50%);
      filter: blur(40px);
    }

    .aurora-glow {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 400px;
      background: linear-gradient(
        180deg,
        rgba(139, 92, 246, 0.6) 0%,
        rgba(236, 72, 153, 0.4) 30%,
        rgba(34, 211, 238, 0.3) 60%,
        transparent 100%
      );
      filter: blur(60px);
      border-radius: 50%;
    }

    /* Mesh gradient overlay */
    .mesh {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(at 40% 20%, rgba(168, 85, 247, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 0%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
        radial-gradient(at 0% 50%, rgba(124, 58, 237, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 50%, rgba(192, 132, 252, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(34, 211, 238, 0.2) 0px, transparent 50%),
        radial-gradient(at 80% 100%, rgba(168, 85, 247, 0.2) 0px, transparent 50%);
    }

    /* Noise texture */
    .noise {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.03;
      mix-blend-mode: overlay;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
      color: white;
    }

    .top-bar {
      position: absolute;
      top: 50px;
      left: 80px;
      right: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .domain {
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.5px;
    }

    .years {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.8) 0%, rgba(236, 72, 153, 0.8) 100%);
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      color: white;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .content {
      max-width: 680px;
    }

    .greeting {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .name {
      font-family: 'Sora', sans-serif;
      font-size: 82px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.9) 50%, rgba(200, 180, 255, 0.9) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .title {
      font-size: 28px;
      font-weight: 600;
      background: linear-gradient(90deg, #a855f7 0%, #ec4899 50%, #22d3ee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 32px;
    }

    .skills {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .skill-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
    }

    .skill-tag svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Floating tech icons - Grid layout */
    .floating-icons {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .floating-icon {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .floating-icon svg {
      width: 26px;
      height: 26px;
    }

    /* Decorative lines */
    .deco-line {
      position: absolute;
      bottom: 50px;
      left: 80px;
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, #a855f7, #ec4899, transparent);
      border-radius: 2px;
    }
  </style>
</head>

name: Deploy to GitHub Pages

# resume is the production branch: it is what Pages publishes to
# ayoub-hidri.dev. Changing it here is only half the switch -- the
# github-pages environment enforces a deployment branch policy, so a branch
# absent from that allowlist fails when the deploy job requests the
# environment, long after verify has gone green.
on:
  push:
    branches: [ resume ]
  pull_request:
    branches: [ resume ]

# No ambient scope; each job asks for exactly what it needs.
permissions: {}

jobs:
  verify:
    name: Verify production artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stage production artifact
        run: bash .github/scripts/stage-site.sh _site

      - name: Verify artifact contents
        run: python3 .github/scripts/verify_site.py _site

  deploy:
    name: Deploy to production
    needs: verify
    # Assert on the event, not only the ref: a pull request's ref is
    # refs/pull/N/merge, so a ref-only test would silently stop protecting
    # production the moment a manual or scheduled trigger is added.
    if: github.event_name == 'push' && github.ref == 'refs/heads/resume'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Same script as the verify job — one manifest, so what was checked
      # is byte-for-byte what is published.
      - name: Stage production artifact
        run: bash .github/scripts/stage-site.sh _site

      - name: Verify artifact contents
        run: python3 .github/scripts/verify_site.py _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
